server {
    listen 5173;
    server_name localhost;

    # Handle assets with correct cache headers
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Handle root-level static files (logo, favicon, SVGs, sitemap, robots)
    location ~* ^/(logo\.png|favicon\.png|flurbix-logo\.svg|icons\.svg|robots\.txt|sitemap\.xml)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}